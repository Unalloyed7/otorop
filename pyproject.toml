[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otorop-engine"
version = "0.1.0"
description = "Общий движок юридического ассистента ПСБ"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.14.2"]

[project.optional-dependencies]
web = ["fastapi==0.143.2", "uvicorn==0.54.0", "starlette==1.10.0"]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "fastapi==0.143.2", "uvicorn==0.54.0", "starlette==1.10.0"]

[tool.setuptools]
py-modules = ["schemas", "llm_client", "assistant", "solution", "search_adapter", "documents", "retrieval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
